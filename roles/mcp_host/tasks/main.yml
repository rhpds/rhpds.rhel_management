---
- name: SSH to mcp target hosts
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.shell: >-
    ssh {{ item }} hostname
  loop: "{{ mcp_host_ssh_target_hosts }}"
  failed_when: false
  changed_when: false
  tags:
    - mcp_setup
    - ssh_check

- name: Ensure user containers config directory exists
  become: true
  ansible.builtin.file:
    path: "/home/{{ student_name }}/.config/containers"
    state: directory
    mode: '0755'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Podman login to registry.redhat.io
  become: true
  become_user: "{{ student_name }}"
  containers.podman.podman_login:
    username: "{{ mcp_host_podman_username }}"
    password: "{{ mcp_host_podman_password }}"
    registry: registry.redhat.io
    authfile: "/home/{{ student_name }}/.config/containers/auth.json"

- name: Change file permissions
  become: true
  ansible.builtin.file:
    path: "/home/{{ student_name }}/.config/containers/auth.json"
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Download goose installer script
  become: true
  ansible.builtin.get_url:
    url: https://github.com/block/goose/releases/download/stable/download_cli.sh
    dest: /tmp/goose_install.sh
    mode: '0755'
    force: true
  retries: 3
  delay: 5

- name: Install goose
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.shell: >-
    CONFIGURE=false /tmp/goose_install.sh
  args:
    creates: "/home/{{ student_name }}/.local/bin/goose"
  environment:
    CONFIGURE: "false"
  changed_when: true

- name: Create goose config dir
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    recurse: true
    mode: '0755'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"
  loop:
    - /home/{{ student_name }}/.config/goose
    - /home/{{ student_name }}/.config/goose/prompts

- name: Copy goose config template
  become: true
  ansible.builtin.template:
    src: goose_config.j2
    dest: /home/{{ student_name }}/.config/goose/config.yaml
    mode: '0600'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"
  diff: false
  no_log: true

- name: Copy goose secret template
  become: true
  ansible.builtin.template:
    src: goose_secrets.j2
    dest: /home/{{ student_name }}/.config/goose/secrets.yaml
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Copy goose permission
  become: true
  ansible.builtin.copy:
    src: permission.yaml
    dest: /home/{{ student_name }}/.config/goose/permission.yaml
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Copy goose systemd.md
  become: true
  ansible.builtin.copy:
    src: system.md
    dest: /home/{{ student_name }}/.config/goose/prompts/system.md
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Install RHEL MCP server with the compatible FastMCP version
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.pip:
    name:
      - linux-mcp-server==1.8.0
      - fastmcp==3.2.4
    state: present
    extra_args: --user

- name: Setup tmux.conf
  become: true
  ansible.builtin.copy:
    content: |
      set -g mouse on
      unbind -n MouseDown3Pane
    dest: /home/{{ student_name }}/.tmux.conf
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Create cert directory
  ansible.builtin.file:
    path: /etc/pki/katello/certs
    state: directory
    recurse: true
    mode: '0755'

- name: Download CA cert
  become: true
  ansible.builtin.get_url:
    url: "{{ mcp_host_satellite_ca_cert_url }}"
    dest: /etc/pki/katello/certs/foreman_raw_ca
    mode: '0644'
    owner: "{{ student_name }}"
    group: "{{ student_name }}"

- name: Allow users to open ports 80 and up without sudo etc
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: 80
    state: present
    reload: true

- name: Get the lab user's UID
  ansible.builtin.command:
    argv: [id, -u, "{{ student_name }}"]
  register: mcp_host_student_uid
  changed_when: false
  check_mode: false

- name: Enable linger for the lab user
  become: true
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ student_name }}"]
    creates: "/var/lib/systemd/linger/{{ student_name }}"

- name: Enable and start the lab user's rootless Podman socket
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ mcp_host_student_uid.stdout }}"
  register: mcp_host_podman_socket_result
  until: mcp_host_podman_socket_result is succeeded
  retries: 10
  delay: 2

# Container must run as student_name for rootless podman
- name: Run MCP server container
  become: true
  become_user: "{{ student_name }}"
  containers.podman.podman_container:
    name: mcp-server
    image: "{{ mcp_host_server_image }}"
    state: started
    restart_policy: always
    ports:
      - "8080:8080"
    volume:
      - /etc/pki/katello/certs/foreman_raw_ca:/app/ca.pem:ro,Z
    command: "{{ mcp_host_container_command }}"
