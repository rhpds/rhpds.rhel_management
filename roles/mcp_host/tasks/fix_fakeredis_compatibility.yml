---
# Fix fakeredis compatibility issue with pydocket
# Issue: pydocket tries to import FakeConnection which was renamed to FakeAsyncRedisConnection
# in fakeredis 2.35.0+

- name: Get Python version for dynamic path
  ansible.builtin.command: python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')"
  register: python_version_output
  changed_when: false
  become: true
  become_user: "{{ student_name }}"
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Set Python version fact
  ansible.builtin.set_fact:
    mcp_host_python_version: "{{ python_version_output.stdout }}"
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Debug - Show Python version and target path
  ansible.builtin.debug:
    msg:
      - "Python version detected: {{ mcp_host_python_version }}"
      - "Student name: {{ student_name }}"
      - "Target docket path will be: /home/{{ student_name }}/.local/lib/python{{ mcp_host_python_version }}/site-packages/docket/_redis.py"
  tags:
    - mcp_fix
    - fakeredis_fix
  when: ansible_verbosity >= 1

- name: Fix py-key-value-aio version compatibility
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.pip:
    name: "py-key-value-aio<0.4.0"
    state: present
    extra_args: --user
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Set docket redis.py path
  ansible.builtin.set_fact:
    mcp_host_docket_redis_path: "/home/{{ student_name }}/.local/lib/python{{ mcp_host_python_version }}/site-packages/docket/_redis.py"
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Check if docket/_redis.py exists
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.stat:
    path: "{{ mcp_host_docket_redis_path }}"
  register: docket_redis_file
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Check if fakeredis patch is already applied
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.lineinfile:
    path: "{{ mcp_host_docket_redis_path }}"
    regexp: 'from fakeredis\.aioredis import FakeAsyncRedisConnection as FakeConnection, FakeServer'
    state: absent
  check_mode: true
  register: patch_check
  when: docket_redis_file.stat.exists
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Backup docket/_redis.py before patching
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.copy:
    src: "{{ mcp_host_docket_redis_path }}"
    dest: "{{ mcp_host_docket_redis_path }}.backup"
    remote_src: true
    owner: "{{ student_name }}"
    group: "{{ student_name }}"
    mode: '0644'
  when:
    - docket_redis_file.stat.exists
    - patch_check is changed
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Patch fakeredis import in docket/_redis.py
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.replace:
    path: "{{ mcp_host_docket_redis_path }}"
    regexp: 'from fakeredis\.aioredis import FakeConnection, FakeServer'
    replace: 'from fakeredis.aioredis import FakeAsyncRedisConnection as FakeConnection, FakeServer'
    backup: false
  when:
    - docket_redis_file.stat.exists
    - patch_check is changed
  tags:
    - mcp_fix
    - fakeredis_fix

- name: Verify patch was applied
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.lineinfile:
    path: "{{ mcp_host_docket_redis_path }}"
    regexp: 'from fakeredis\.aioredis import FakeAsyncRedisConnection as FakeConnection, FakeServer'
    state: absent
  check_mode: true
  register: verify_patch
  failed_when: verify_patch is changed
  when: docket_redis_file.stat.exists
  tags:
    - mcp_fix
    - fakeredis_fix
    - mcp_verify

- name: Check if linux-mcp-server binary exists
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.stat:
    path: "/home/{{ student_name }}/.local/bin/linux-mcp-server"
  register: mcp_server_binary
  tags:
    - mcp_fix
    - fakeredis_fix
    - mcp_verify

- name: Verify linux-mcp-server can start (non-blocking test)
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.command:
    cmd: timeout 3 /home/{{ student_name }}/.local/bin/linux-mcp-server
  register: mcp_server_test
  failed_when:
    - mcp_server_test.rc != 124  # 124 is timeout exit code (expected)
    - mcp_server_test.rc != 0
    - "'CRITICAL' in mcp_server_test.stderr or 'ImportError' in mcp_server_test.stderr"
  changed_when: false
  when: mcp_server_binary.stat.exists
  tags:
    - mcp_fix
    - fakeredis_fix
    - mcp_verify

- name: Display fix summary
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "FakeRedis Compatibility Fix Summary"
      - "========================================="
      - "Python version: {{ mcp_host_python_version }}"
      - "Docket file exists: {{ docket_redis_file.stat.exists | default(false) }}"
      - "Patch was needed: {{ patch_check is defined and patch_check is changed }}"
      - "Patch applied: {{ (patch_check is defined and patch_check is changed) | ternary('Yes', 'No - already applied or file not found') }}"
      - "linux-mcp-server binary exists: {{ mcp_server_binary.stat.exists | default(false) }}"
      - "linux-mcp-server test: {{ 'Passed' if (mcp_server_binary.stat.exists and mcp_server_test.rc == 124) else 'Skipped or N/A' }}"
      - "========================================="
  tags:
    - mcp_fix
    - fakeredis_fix
    - mcp_verify
