---
# Verification tasks to ensure MCP host setup completed successfully

- name: Verify goose installation
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.command: /home/{{ student_name }}/.local/bin/goose --version
  register: goose_version
  changed_when: false
  failed_when: goose_version.rc != 0
  tags:
    - mcp_verify
    - verify

- name: Verify linux-mcp-server installation
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.stat:
    path: "/home/{{ student_name }}/.local/bin/linux-mcp-server"
  register: mcp_binary
  failed_when: not mcp_binary.stat.exists
  tags:
    - mcp_verify
    - verify

- name: Verify goose config exists
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.stat:
    path: "/home/{{ student_name }}/.config/goose/config.yaml"
  register: goose_config
  failed_when: not goose_config.stat.exists
  tags:
    - mcp_verify
    - verify

- name: Verify goose secrets exists
  become: true
  become_user: "{{ student_name }}"
  ansible.builtin.stat:
    path: "/home/{{ student_name }}/.config/goose/secrets.yaml"
  register: goose_secrets
  failed_when: not goose_secrets.stat.exists
  tags:
    - mcp_verify
    - verify

- name: Verify MCP server container is running
  become: true
  become_user: "{{ student_name }}"
  containers.podman.podman_container_info:
    name: mcp-server
  register: mcp_container
  failed_when: >-
    mcp_container.containers | length == 0 or
    mcp_container.containers[0].State.Running != true
  tags:
    - mcp_verify
    - verify

- name: Display verification summary
  ansible.builtin.debug:
    msg:
      - "========================================="
      - "MCP Host Setup Verification Summary"
      - "========================================="
      - "Goose version: {{ goose_version.stdout }}"
      - "linux-mcp-server exists: {{ mcp_binary.stat.exists }}"
      - "Goose config exists: {{ goose_config.stat.exists }}"
      - "Goose secrets exists: {{ goose_secrets.stat.exists }}"
      - "MCP server container running: {{ mcp_container.containers[0].State.Running }}"
      - "MCP server container status: {{ mcp_container.containers[0].State.Status }}"
      - "========================================="
  tags:
    - mcp_verify
    - verify
