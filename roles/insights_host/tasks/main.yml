---
- name: Unregister from subscription manager
  ansible.builtin.shell: >-
    subscription-manager unregister
  ignore_errors: true

- name: Remove katello-ca-consumer package
  ansible.builtin.dnf:
    name: katello-ca-consumer*
    state: absent

- name: Set network.fqdn in /etc/rhsm/facts/katello.facts
  ansible.builtin.copy:
    dest: /etc/rhsm/facts/katello.facts
    content: '{"network.fqdn": "{{ inventory_hostname }}"}'
    mode: ug=rw,o=r

- name: Register node with Red Hat Insights
  ansible.builtin.command: >-
    rhc connect
    -o {{ insights_host_org }}
    -a {{ insights_host_activation_key }}

- name: Run insights-client to generate config files
  ansible.builtin.command: insights-client --collector malware-detection

- name: Configure insight malware detection
  ansible.builtin.lineinfile:
    line: "test_scan: false"
    regexp: "^test_scan: true"
    path: /etc/insights-client/malware-detection-config.yml

- name: Initialize PostgreSQL database
  block:
    - name: Initialize the db
      ansible.builtin.command: >-
        /usr/bin/postgresql-setup --initdb

  rescue:
    - name: Remove existing PostgreSQL data directory
      ansible.builtin.file:
        path: /var/lib/pgsql/data
        state: absent

    - name: Retry PostgreSQL database initialization
      ansible.builtin.command: >-
        /usr/bin/postgresql-setup --initdb

- name: Enable and start the postgresql service
  ansible.builtin.service:
    name: postgresql
    enabled: true
    state: started
